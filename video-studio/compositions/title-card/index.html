<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Title card</title>
  </head>
  <body>
    <main class="stage">
      <div class="glow"></div>
      <p class="kicker"><span>✦</span> دليل سريع</p>
      <h1 class="headline">
        <span class="word">حوّل</span> <span class="word">فكرتك</span>
        <span class="word highlight">لفيديو موشن</span>
      </h1>
      <div class="counter"><span class="num">0</span><span class="unit">%</span></div>
      <ul class="list">
        <li><span class="tick">✓</span> توقيت وحركة طبيعية</li>
        <li><span class="tick">✓</span> رسوم توضيحية و3D</li>
        <li><span class="tick">✓</span> صوت ومؤثرات مجانية</li>
      </ul>
      <p class="cta">ابدأ النهارده</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
